<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoply - Ana Səhifə</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        nav {
            background: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 120px 20px;
        }

        .hero h1 {
            font-size: 45px;
        }

        .hero p {
            font-size: 20px;
            color: #666;
        }

        .login-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">SHOPLY</div>

        <div>
            <a href="/">Ana səhifə</a>
            <a href="/login">Daxil ol</a>
        </div>
    </nav>

    <div class="hero">
        <h1>Shoply-ə xoş gəlmisiniz!</h1>

        <p>İstədiyiniz məhsulları asanlıqla tapın və sifariş edin.</p>

        <a href="/login" class="login-btn">Daxil ol</a>
    </div>

</body>

</html>
