<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shoply - Daxil ol</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #111;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Daxil ol</h1>

        <form>

            <label>Email</label>
            <input type="email" name="email" placeholder="Emailinizi daxil edin">

            <label>Şifrə</label>
            <input type="password" name="password" placeholder="Şifrənizi daxil edin">

            <button type="submit">
                Daxil ol
            </button>

        </form>

        <a href="/" class="back">
            ← Ana səhifəyə qayıt
        </a>

    </div>

</body>
</html>
